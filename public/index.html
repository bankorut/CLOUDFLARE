<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Social App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    <header class="flex items-center justify-between border-b border-gray-800 pb-4">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-400 to-amber-500 bg-clip-text text-transparent">
        Cloudflare Social
      </h1>
      <span class="text-xs px-2.5 py-1 rounded-full bg-orange-500/10 text-orange-400 font-mono">Live D1 + Workers</span>
    </header>
    <form id="postForm" class="bg-gray-900 p-4 rounded-xl border border-gray-800 space-y-3">
      <input type="text" id="username" placeholder="@username" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-orange-500">
      <textarea id="post" placeholder="Apa yang sedang terjadi?" rows="3" class="w-full bg-gray-950 border border-gray-800 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-orange-500 resize-none"></textarea>
      <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 rounded-lg text-sm transition-all">
        Kirim Postingan
      </button>
    </form>
    <div id="posts" class="space-y-4"></div>
  </div>
  <script>
    async function loadPosts() {
      try {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const container = document.getElementById('posts');
        container.innerHTML = posts.map(p => `
          <div class="bg-gray-900 p-4 rounded-xl border border-gray-800">
            <span class="text-xs font-semibold text-orange-400">@${p.user_name || p.username || 'anon'}</span>
            <p class="text-sm text-gray-300 mt-2">${p.content || p.post || ''}</p>
          </div>
        `).join('');
      } catch (err) { console.error(err); }
    }
    loadPosts();
  </script>
</body>
</html>
