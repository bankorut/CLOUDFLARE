<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Social App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8 font-sans">
  <div class="max-w-2xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="flex items-center justify-between border-b border-gray-800 pb-4">
      <h1 class="text-2xl font-bold bg-gradient-to-r from-orange-400 to-amber-500 bg-clip-text text-transparent">
        Cloudflare Social
      </h1>
      <span class="text-xs px-2.5 py-1 rounded-full bg-orange-500/10 text-orange-400 font-mono">D1 + Workers</span>
    </header>

    <!-- Form Post -->
    <form id="postForm" class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3">
      <input type="text" id="username" placeholder="@username" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-orange-500">
      <input type="text" id="title" placeholder="Judul postingan..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-orange-500">
      <textarea id="post" placeholder="Apa yang sedang terjadi?" rows="3" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-orange-500 resize-none"></textarea>
      <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-medium py-2 rounded-lg text-sm transition-all">
        Kirim Postingan
      </button>
    </form>

    <!-- Container Postingan -->
    <div id="posts" class="space-y-4"></div>
  </div>

  <script>
    async function loadPosts() {
      try {
        const res = await fetch('/api/posts');
        const posts = await res.json();
        const container = document.getElementById('posts');
        container.innerHTML = posts.map(p => `
          <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/80 hover:border-gray-600 transition-all">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold text-orange-400">@${p.username || 'anon'}</span>
            </div>
            <h3 class="font-bold text-gray-100 mb-1">${p.title}</h3>
            <p class="text-sm text-gray-300 leading-relaxed">${p.content || p.post}</p>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load posts:', err);
      }
    }
    loadPosts();
  </script>
</body>
</html>
